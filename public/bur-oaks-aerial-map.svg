<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Bur Oaks campground aerial style map">
  <defs>
    <linearGradient id="grass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173a24"/>
      <stop offset=".48" stop-color="#2f5d35"/>
      <stop offset="1" stop-color="#102d1d"/>
    </linearGradient>
    <radialGradient id="lake" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#6ca6a4"/>
      <stop offset=".62" stop-color="#2e6f75"/>
      <stop offset="1" stop-color="#184a56"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".95" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values=".22"/>
      <feBlend mode="soft-light" in2="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#06170c" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#grass)"/>
  <g opacity=".22" filter="url(#grain)">
    <rect width="1200" height="720" fill="#ffffff"/>
  </g>

  <!-- Tree canopy texture -->
  <g opacity=".42">
    <circle cx="90" cy="90" r="62" fill="#0e2c1c"/>
    <circle cx="230" cy="70" r="88" fill="#214a2a"/>
    <circle cx="1090" cy="110" r="95" fill="#0f2e1d"/>
    <circle cx="1005" cy="615" r="120" fill="#173c25"/>
    <circle cx="178" cy="600" r="130" fill="#12341f"/>
    <circle cx="610" cy="645" r="95" fill="#254f2d"/>
    <circle cx="1040" cy="420" r="82" fill="#21492b"/>
    <circle cx="710" cy="95" r="84" fill="#12301f"/>
  </g>

  <!-- Water / lake -->
  <path d="M78 245 C145 135, 331 116, 424 181 C528 253, 512 405, 401 475 C278 554, 99 501, 58 383 C39 326, 44 286, 78 245 Z" fill="url(#lake)" opacity=".94" filter="url(#shadow)"/>
  <path d="M116 286 C190 221, 313 211, 390 256" fill="none" stroke="#b7dbd3" stroke-width="8" stroke-linecap="round" opacity=".25"/>
  <text x="196" y="356" fill="#d8f2ed" font-family="Arial, sans-serif" font-size="34" font-weight="800" opacity=".9">Lake</text>

  <!-- Main road -->
  <path d="M-35 535 C120 480, 210 464, 348 493 C485 522, 580 581, 746 542 C890 508, 1010 430, 1235 444" fill="none" stroke="#c8b58a" stroke-width="48" stroke-linecap="round" opacity=".9"/>
  <path d="M-35 535 C120 480, 210 464, 348 493 C485 522, 580 581, 746 542 C890 508, 1010 430, 1235 444" fill="none" stroke="#7c6642" stroke-width="4" stroke-dasharray="18 18" opacity=".45"/>
  <text x="720" y="520" fill="#4f3d23" font-family="Arial, sans-serif" font-size="24" font-weight="900" transform="rotate(-10 720 520)">Oaks Road</text>

  <!-- Rec hall / central amenities -->
  <g filter="url(#shadow)">
    <rect x="545" y="256" width="152" height="96" rx="18" fill="#e7ddbf"/>
    <rect x="565" y="277" width="112" height="18" rx="5" fill="#7a5533" opacity=".8"/>
    <text x="568" y="331" fill="#254330" font-family="Arial, sans-serif" font-size="22" font-weight="900">Rec Hall</text>
  </g>
  <g>
    <rect x="734" y="260" width="86" height="56" rx="15" fill="#d6c18a"/>
    <text x="746" y="294" fill="#254330" font-family="Arial, sans-serif" font-size="15" font-weight="900">Gate</text>
    <rect x="466" y="385" width="110" height="55" rx="15" fill="#d9e4c5"/>
    <text x="482" y="418" fill="#254330" font-family="Arial, sans-serif" font-size="16" font-weight="900">Baths</text>
  </g>

  <!-- Campsite loops -->
  <g fill="none" stroke="#d7c79a" stroke-width="24" stroke-linecap="round" opacity=".82">
    <path d="M525 159 C650 93, 856 97, 955 185 C1027 249, 1012 346, 912 382 C793 424, 645 388, 568 316"/>
    <path d="M398 548 C520 444, 742 421, 900 476 C1005 513, 1078 580, 1138 670"/>
  </g>
  <g fill="none" stroke="#6d5b3e" stroke-width="3" stroke-dasharray="12 14" opacity=".45">
    <path d="M525 159 C650 93, 856 97, 955 185 C1027 249, 1012 346, 912 382 C793 424, 645 388, 568 316"/>
    <path d="M398 548 C520 444, 742 421, 900 476 C1005 513, 1078 580, 1138 670"/>
  </g>

  <!-- Site pads -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle">
    <g fill="#f4efd9" stroke="#315f3d" stroke-width="3">
      <rect x="560" y="121" width="54" height="34" rx="9"/><rect x="642" y="100" width="54" height="34" rx="9"/><rect x="727" y="101" width="54" height="34" rx="9"/><rect x="812" y="123" width="54" height="34" rx="9"/><rect x="899" y="169" width="54" height="34" rx="9"/>
      <rect x="956" y="249" width="54" height="34" rx="9"/><rect x="915" y="336" width="54" height="34" rx="9"/><rect x="810" y="371" width="54" height="34" rx="9"/><rect x="704" y="356" width="54" height="34" rx="9"/><rect x="610" y="323" width="54" height="34" rx="9"/>
      <rect x="445" y="512" width="54" height="34" rx="9"/><rect x="536" y="478" width="54" height="34" rx="9"/><rect x="628" y="459" width="54" height="34" rx="9"/><rect x="724" y="462" width="54" height="34" rx="9"/><rect x="820" y="493" width="54" height="34" rx="9"/>
      <rect x="908" y="548" width="54" height="34" rx="9"/><rect x="992" y="608" width="54" height="34" rx="9"/>
    </g>
    <g fill="#315f3d">
      <text x="587" y="144">101</text><text x="669" y="123">102</text><text x="754" y="124">103</text><text x="839" y="146">104</text><text x="926" y="192">105</text>
      <text x="983" y="272">110</text><text x="942" y="359">115</text><text x="837" y="394">120</text><text x="731" y="379">125</text><text x="637" y="346">130</text>
      <text x="472" y="535">201</text><text x="563" y="501">202</text><text x="655" y="482">203</text><text x="751" y="485">204</text><text x="847" y="516">205</text>
      <text x="935" y="571">210</text><text x="1019" y="631">215</text>
    </g>
  </g>

  <!-- Highlight generic camper site -->
  <g filter="url(#shadow)">
    <rect x="100" y="108" width="205" height="58" rx="18" fill="#f4efd9"/>
    <circle cx="132" cy="137" r="18" fill="#315f3d"/>
    <path d="M132 126 C126 126 122 131 122 136 C122 148 132 156 132 156 C132 156 142 148 142 136 C142 131 138 126 132 126 Z" fill="#f4efd9"/>
    <circle cx="132" cy="136" r="5" fill="#315f3d"/>
    <text x="164" y="132" fill="#9a7834" font-family="Arial, sans-serif" font-size="12" font-weight="900">YOUR SITE</text>
    <text x="164" y="153" fill="#263d2e" font-family="Arial, sans-serif" font-size="20" font-weight="900">Lot shown in portal</text>
  </g>
</svg>
